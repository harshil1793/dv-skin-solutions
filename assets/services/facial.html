<div class="container-color-two " >
      <div class="container-fluid">
        <div class="row">
          <div class="col-lg-12">
            <div class="promo-block">
              <div class="promo-text">Facial Treatments</div>
                <div class="center-line"></div>
            </div>
          </div>
        </div>
        <div class="row marg30" ng-repeat="crib in cribs">
            
            <div class="neighborhood-guides" >
                <div class="container">
                    
                    <div class="row ">
                        <h2>{{crib.name}} </h2>
                        <div class="col-md-8 learn-more ">
                            <p>{{crib.description }}</p>
                        </div>
                        <div class="col-md-3">
                            <p>Time <span>  {{crib.time}} Mins</span></p>
                            <p>Price <span>  {{ crib.price | currency }} </span></p>
                        </div>
                        
                    </div>
                    
                </div>
                
            </div>

        </div>
          
      </div>  
    </div>
